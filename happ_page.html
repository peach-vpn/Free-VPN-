<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🍑 PeachVPN</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #09070d;
    color: white;
    font-family: Arial, sans-serif;
}

.card {
    width: 90%;
    max-width: 420px;
    padding: 30px;
    text-align: center;
    border-radius: 24px;
    background: #15111d;
    box-shadow: 0 15px 50px #000;
}

.logo {
    font-size: 58px;
}

h1 {
    margin: 10px 0;
}

p {
    color: #aaa;
}

button {
    width: 100%;
    padding: 16px;
    margin-top: 15px;
    border: 0;
    border-radius: 14px;
    font-size: 18px;
    font-weight: bold;
    background: #ff8c42;
    color: white;
}

a {
    text-decoration: none;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">🍑</div>

    <h1>PeachVPN</h1>

    <p>Твоя персональная VPN-подписка</p>

    <a id="happLink">
        <button>🍑 Открыть в Happ</button>
    </a>

    <p id="status">
        Загрузка подписки...
    </p>

</div>

<script>
const params = new URLSearchParams(location.search);
const sub = params.get("sub");

const status = document.getElementById("status");
const link = document.getElementById("happLink");

if (!sub) {

    status.textContent =
        "❌ Ссылка на подписку отсутствует";

} else {

    link.href =
        "happ://add/" +
        encodeURIComponent(sub);

    status.textContent =
        "Нажми кнопку выше, чтобы открыть Happ.";
}
</script>

</body>
</html>
