<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>🍑 Персик VPN</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111111;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .box {
            width: calc(100% - 40px);
            max-width: 500px;
            padding: 30px 20px;
            box-sizing: border-box;
        }

        .logo {
            font-size: 52px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 25px;
        }

        p {
            color: #bbbbbb;
            line-height: 1.5;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: #1d1d1d;
        }

        .error {
            color: #ff7777;
        }

        .ok {
            color: #8cff9b;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">🍑</div>

    <h1>Персик VPN</h1>

    <p id="status">
        Проверка подписки...
    </p>

</div>

<script>
(function () {

    const status = document.getElementById("status");

    function getToken() {
        const params = new URLSearchParams(
            window.location.search
        );

        return (
            params.get("token") ||
            params.get("id") ||
            params.get("sub") ||
            ""
        ).trim();
    }

    function isValidToken(token) {
        return /^[A-Za-z0-9_-]+$/.test(token);
    }

    async function loadSubscription() {

        const token = getToken();

        if (!token) {
            status.innerHTML =
                '<span class="error">' +
                '❌ Токен подписки не указан.' +
                '</span>';

            return;
        }

        if (!isValidToken(token)) {
            status.innerHTML =
                '<span class="error">' +
                '❌ Некорректный токен.' +
                '</span>';

            return;
        }

        const url =
            "https://raw.githubusercontent.com/" +
            "peach-vpn/Free-VPN-/" +
            "main/subscriptions/" +
            encodeURIComponent(token) +
            ".txt";

        try {

            const response = await fetch(
                url + "?t=" + Date.now(),
                {
                    cache: "no-store"
                }
            );

            if (!response.ok) {
                throw new Error(
                    "HTTP " + response.status
                );
            }

            const text =
                await response.text();

            if (!text.trim()) {
                throw new Error(
                    "Пустая подписка"
                );
            }

            /*
             * ВАЖНО:
             *
             * Мы НЕ разбираем серверы.
             * Мы НЕ удаляем строки.
             * Мы НЕ выбираем Германию.
             * Мы НЕ используем slice().
             *
             * Возвращаем весь файл целиком.
             */

            status.innerHTML =
                '<span class="ok">' +
                '✅ Подписка активна' +
                '</span>';

            /*
             * Для клиентов, которые открывают
             * страницу как HTTP-источник,
             * показываем весь полученный файл.
             */

            const pre =
                document.createElement("pre");

            pre.textContent = text;

            pre.style.cssText =
                "display:none;";

            document.body.appendChild(pre);

            /*
             * Если страницу открыли обычным браузером,
             * оставляем статус.
             *
             * Сам файл подписки находится
             * непосредственно по URL:
             *
             * /subscriptions/TOKEN.txt
             */

        } catch (error) {

            console.error(error);

            status.innerHTML =
                '<span class="error">' +
                '❌ Не удалось загрузить подписку.' +
                '</span>';
        }
    }

    loadSubscription();

})();
</script>

</body>
</html>
